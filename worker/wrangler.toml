name = "embergard-integrity"
main = "src/index.ts"
compatibility_date = "2026-11-25"

# Routes:
#   embergard.app/api/integrity        — Play Integrity server verification
#   embergard.app/api/stripe/checkout  — create Stripe Checkout Session
#   embergard.app/api/stripe/session   — poll Checkout Session status
#
# Deploy with: npx wrangler deploy
#
# Secrets (never in vars/git):
#   npx wrangler secret put GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#   npx wrangler secret put STRIPE_SECRET_KEY       # sk_test_... or sk_live_...
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   # whsec_... from the Stripe dashboard webhook endpoint
#
# Optional vars: when stable Price IDs exist, fill them in and the worker stops
# falling back to inline price_data.

[vars]
GOOGLE_CLOUD_PROJECT_NUMBER = "378810733196"
PACKAGE_NAME = "com.embergard.app"
SITE_URL = "https://embergard.app"
# EXPECTED_CERT_SHA256 = "<SHA-256 of the Play App Signing certificate>"
#   Get it from: Play Console → Release → Setup → App signing →
#   "App signing key certificate" → SHA-256 fingerprint (strip colons, or
#   keep base64 — the worker tolerates both hex-without-colons and base64).
#   When set, /api/integrity rejects verdicts signed by any other key.
# STRIPE_PRICE_MONTHLY = "price_xxx"   # uncomment when created
# STRIPE_PRICE_YEARLY  = "price_yyy"   # uncomment when created
